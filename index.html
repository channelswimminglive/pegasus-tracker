
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessel Tracker - Dover Strait</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
        .map-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>Vessel Tracker: Dover Strait (MMSI: 232018618)</h1>
    <div class="map-container">
        <script type="text/javascript">
            // Map appearance
            var width = "100%"; // width in pixels or percentage
            var height = "500"; // height in pixels
            var latitude = "51.0"; // center latitude (Dover Strait)
            var longitude = "1.5"; // center longitude (Dover Strait)
            var zoom = "10"; // zoom level to cover Dover to Calais
            var names = true; // show ship names
            // Single ship tracking
            var mmsi = "232018618"; // MMSI of the vessel to track
            var show_track = true; // display track line (last 24 hours)
        </script>
        <script type="text/javascript" src="https://www.vesselfinder.com/aismap.js"></script>
    </div>
</body>
</html>
